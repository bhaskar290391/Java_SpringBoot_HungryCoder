version: "3.8"

services:
  patient-service:
    image : patient
    container_name: patient-container
    networks:
      - app-network
    ports:
      - '8080:8080'

  doctor-service:
    image: doctor
    container_name: doctor-container
    depends_on:
      - patient-service
    networks:
      - app-network
    ports:
      - '8081:8080'

networks:
  app-network :