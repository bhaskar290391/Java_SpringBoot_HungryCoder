version: "3.8"

services:
  doctor-service:
    image: doctors
    container_name: doctor-container
    depends_on:
      - patient-service
    networks:
      - app-network
    healthcheck:
      test: ['CMD',"curl","-f","http://localhost:8080/actuator/health"]		
      interval: 30s		
      timeout: 10s
      retries: 3	  		 
    ports:
      - "8081:8080"
  
  patient-service:
    image: patients
    container_name: patient-container
    ports:
      - "8082:8080"
    networks:
      - app-network
    healthcheck:
      test: ['CMD',"curl","-f","http://localhost:8080/actuator/health"]		
      interval: 30s		
      timeout: 10s
      retries: 3
networks:
  app-network:	     